name: Static Build (Linux & macOS)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/static-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/static-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEPENDENCIES_VERSION: "2026.07.18.1340"

jobs:
  build-linux-glibc:
    name: Linux x64 Static (Glibc)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout ImageMagick
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y autoconf binutils gcc g++ libtool make pkg-config zip

      - name: Download Pre-built Static Dependencies
        run: |
          mkdir -p /tmp/dependencies
          curl -sSL "https://github.com/ImageMagick/Dependencies/releases/download/${DEPENDENCIES_VERSION}/linux-x64-static.zip" -o /tmp/deps.zip
          unzip -q /tmp/deps.zip -d /tmp/dependencies

      - name: Configure and build ImageMagick
        run: |
          export PKG_CONFIG="pkg-config --static"
          export PKG_CONFIG_PATH="/tmp/dependencies/lib/pkgconfig:/tmp/dependencies/lib64/pkgconfig:$PKG_CONFIG_PATH"
          export LDFLAGS="-L/tmp/dependencies/lib -L/tmp/dependencies/lib64"
          export CPPFLAGS="-I/tmp/dependencies/include"
          autoreconf -fiv
          ./configure --enable-static --disable-shared --with-quantum-depth=16 --prefix=/tmp/im-dist
          make -j$(nproc)
          make install

      - name: Archive static binaries
        run: |
          cd /tmp/im-dist
          tar -czvf ${{ github.workspace }}/imagemagick-linux-x64-static.tar.gz bin/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: imagemagick-linux-x64-static
          path: imagemagick-linux-x64-static.tar.gz

  build-linux-musl:
    name: Linux x64 Static (Musl - Portable)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout ImageMagick
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build fully static binary in Alpine Docker container
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace alpine:3.21 sh -c "
            set -e
            apk add --no-cache autoconf automake bash binutils g++ gcc gettext-tiny libtool make pkgconf curl zip
            
            mkdir -p /tmp/dependencies
            curl -sSL 'https://github.com/ImageMagick/Dependencies/releases/download/${DEPENDENCIES_VERSION}/linux-musl-x64-static.zip' -o /tmp/deps.zip
            unzip -q /tmp/deps.zip -d /tmp/dependencies
            
            export PKG_CONFIG='pkg-config --static'
            export PKG_CONFIG_PATH='/tmp/dependencies/lib/pkgconfig:/tmp/dependencies/lib64/pkgconfig:\$PKG_CONFIG_PATH'
            export LDFLAGS='-L/tmp/dependencies/lib -L/tmp/dependencies/lib64 -static'
            export CPPFLAGS='-I/tmp/dependencies/include'
            autoreconf -fiv
            ./configure --enable-static --disable-shared --with-quantum-depth=16 --prefix=/tmp/im-dist
            make -j\$(nproc)
            make install
            
            cd /tmp/im-dist
            tar -czvf /workspace/imagemagick-linux-musl-x64-static.tar.gz bin/
          "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: imagemagick-linux-musl-x64-static
          path: imagemagick-linux-musl-x64-static.tar.gz

  build-macos:
    name: macOS ${{ matrix.architecture }} Static
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-14
            asset: macos-arm64-static.zip
          - architecture: x64
            runner: macos-15-intel
            asset: macos-x64-static.zip
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout ImageMagick
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          brew install automake libtool pkg-config

      - name: Download Pre-built Static Dependencies
        run: |
          mkdir -p /tmp/dependencies
          curl -sSL "https://github.com/ImageMagick/Dependencies/releases/download/${DEPENDENCIES_VERSION}/${{ matrix.asset }}" -o /tmp/deps.zip
          unzip -q /tmp/deps.zip -d /tmp/dependencies

      - name: Configure and build ImageMagick
        run: |
          export PKG_CONFIG="pkg-config --static"
          export PKG_CONFIG_PATH="/tmp/dependencies/lib/pkgconfig:$PKG_CONFIG_PATH"
          export LDFLAGS="-L/tmp/dependencies/lib"
          export CPPFLAGS="-I/tmp/dependencies/include"
          autoreconf -fiv
          ./configure --enable-static --disable-shared --with-quantum-depth=16 --prefix=/tmp/im-dist
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Archive static binaries
        run: |
          cd /tmp/im-dist
          tar -czvf ${{ github.workspace }}/imagemagick-macos-${{ matrix.architecture }}-static.tar.gz bin/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: imagemagick-macos-${{ matrix.architecture }}-static
          path: imagemagick-macos-${{ matrix.architecture }}-static.tar.gz
